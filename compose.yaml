services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: onda
      POSTGRES_USER: onda
      POSTGRES_PASSWORD: onda
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onda -d onda"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - onda_postgres:/var/lib/postgresql/data

volumes:
  onda_postgres:

